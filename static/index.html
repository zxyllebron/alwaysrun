<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Alwaysrun · 个人工作台</title>
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <aside class="sidebar">
    <a href="#overview" class="brand"><span class="brand-mark">a</span>alwaysrun<span class="local">LOCAL</span></a>
    <nav aria-label="主导航">
      <a href="#overview" data-page="overview">工作台</a>
      <a href="#projects" data-page="projects">项目</a>
      <a href="#context" data-page="context">资料</a>
      <a href="#chat" data-page="chat">对话</a>
      <details id="more-nav" class="more-nav">
        <summary>更多</summary>
        <div class="more-links">
          <a href="#preferences" data-page="preferences">我的判断</a>
          <a href="#runs" data-page="runs">运行记录</a>
          <a href="#settings" data-page="settings">设置</a>
        </div>
      </details>
    </nav>
    <div class="sidebar-bottom"><div class="profile"><span class="avatar">A</span><div><strong id="profile-name">User</strong><small>本机运行</small></div></div></div>
  </aside>
  <div class="shell">
    <header class="topbar"><span class="top-date" id="date"></span><div class="header-actions"><button class="text-button" id="refresh" aria-label="同步资料">同步</button><a class="connection-status" id="connection-status" href="#settings">连接中</a></div></header>
    <main id="main"><div class="empty">正在连接 alwaysrun…</div></main>
  </div>
  <div id="toast" role="status"></div>
  <dialog id="detail"><div class="dialog-head"><strong id="detail-title"></strong><button id="close-detail" class="icon-button" aria-label="关闭">×</button></div><div id="detail-body"></div></dialog>
</body>
</html>
